name: CICD

on: [push]

env:
  GH_TOKEN: ${{ github.token }}

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  # Only one side branch run at a time. Every commit runs in parallel on main and staging branch
  group: ${{ github.workflow }}-${{ github.ref }}-${{ contains(fromJSON('["refs/heads/main", "refs/heads/staging"]'), github.ref) && github.sha || '' }}
  cancel-in-progress: true

jobs:
  workspace-setup:
    name: Workspace setup
    runs-on: gh-actions-4cpu4gb-runner-set
    outputs:
      cache-key: ${{ env.CACHE_KEY }}
      helpdesk-affected: ${{ env.HELPDESK_AFFECTED }}
      has-other-affected-packages: ${{ env.HAS_OTHER_AFFECTED_PACKAGES }}
      packages-test-buckets: ${{ env.PACKAGES_TEST_BUCKETS }}
      packages-test-bucket-count: ${{ env.PACKAGES_TEST_BUCKET_COUNT }}
      nx-base-commit: ${{ env.NX_BASE_COMMIT }}
      assets-dir: apps/helpdesk/src/assets
      build-dir: apps/helpdesk/build
      bucket-path: web-app
      node-version: "24.15.0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Nx affected needs full history to resolve the merge base with origin/main.
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        id: install-dependencies
        with:
          node-version: "24.15.0"
          npm-token: ${{ secrets.GH_READ_PACKAGES_TOKEN }}

      - name: Get affected packages
        id: get-affected-packages
        run: |
          # Determine the base commit for affected detection
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            # On main branch, compare against the previous commit
            NX_BASE_COMMIT="HEAD~1"
            echo "On main branch, using base commit: $NX_BASE_COMMIT"
          else
            # On feature branches, compare against origin/main
            NX_BASE_COMMIT="origin/main"
            echo "On feature branch, using base commit: $NX_BASE_COMMIT"
          fi
          echo "NX_BASE_COMMIT=$NX_BASE_COMMIT" >> "$GITHUB_ENV"

          # Check if @repo/helpdesk is affected
          HELPDESK_AFFECTED_JSON=$(npx nx show projects --affected --projects=@repo/helpdesk --json --base="$NX_BASE_COMMIT" --head=HEAD)
          if echo "$HELPDESK_AFFECTED_JSON" | jq -e '. | length > 0' > /dev/null; then
            echo "HELPDESK_AFFECTED=true" >> "$GITHUB_ENV"
            echo "@repo/helpdesk is affected"
          else
            echo "HELPDESK_AFFECTED=false" >> "$GITHUB_ENV"
            echo "@repo/helpdesk is not affected"
          fi

          PACKAGES_TEST_BUCKETS_RESULT=$(pnpm exec tsx scripts/ci/build-packages-test-buckets.ts \
            --base "$NX_BASE_COMMIT" \
            --head HEAD \
            --exclude @repo/helpdesk \
            --max-buckets 6)
          PACKAGES_TEST_BUCKET_COUNT=$(echo "$PACKAGES_TEST_BUCKETS_RESULT" | jq -r '.bucketCount')
          PACKAGES_TEST_BUCKETS=$(echo "$PACKAGES_TEST_BUCKETS_RESULT" | jq -c '.buckets')

          echo "PACKAGES_TEST_BUCKETS=$PACKAGES_TEST_BUCKETS" >> "$GITHUB_ENV"
          echo "PACKAGES_TEST_BUCKET_COUNT=$PACKAGES_TEST_BUCKET_COUNT" >> "$GITHUB_ENV"

          if [ "$PACKAGES_TEST_BUCKET_COUNT" -gt 0 ]; then
            echo "HAS_OTHER_AFFECTED_PACKAGES=true" >> "$GITHUB_ENV"
            echo "Found package test buckets: $PACKAGES_TEST_BUCKETS"
          else
            echo "HAS_OTHER_AFFECTED_PACKAGES=false" >> "$GITHUB_ENV"
            echo "No other affected packages with test:ci:cover target found"
          fi

  quality-check:
    name: Quality check
    needs:
      - workspace-setup
    uses: ./.github/workflows/quality-check.yml
    secrets: inherit
    with:
      cache-key: ${{ needs.workspace-setup.outputs.cache-key }}
      node-version: ${{ needs.workspace-setup.outputs.node-version }}
      helpdesk-affected: ${{ needs.workspace-setup.outputs.helpdesk-affected }}
      has-other-affected-packages: ${{ needs.workspace-setup.outputs.has-other-affected-packages }}
      packages-test-buckets: ${{ needs.workspace-setup.outputs.packages-test-buckets }}
      packages-test-bucket-count: ${{ needs.workspace-setup.outputs.packages-test-bucket-count }}
      nx-base-commit: ${{ needs.workspace-setup.outputs.nx-base-commit }}

  build-smoke-test:
    name: Build smoke test
    if: github.ref != 'refs/heads/staging' && github.ref != 'refs/heads/main'
    needs:
      - workspace-setup
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      cache-key: ${{ needs.workspace-setup.outputs.cache-key }}
      node-version: ${{ needs.workspace-setup.outputs.node-version }}
      assets-url: https://gorgias-assets.gorgias.xyz/preview/${{ github.sha }}/${{ needs.workspace-setup.outputs.bucket-path }}
      release: smoke-test-${{ github.sha }}
      build-dir: ${{ needs.workspace-setup.outputs.build-dir }}
      artifact: smoke-test-build

  build-staging:
    name: Build staging
    if: github.ref == 'refs/heads/staging'
    needs:
      - workspace-setup
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      cache-key: ${{ needs.workspace-setup.outputs.cache-key }}
      node-version: ${{ needs.workspace-setup.outputs.node-version }}
      assets-url: https://gorgias-assets.gorgias.xyz/${{ needs.workspace-setup.outputs.bucket-path }}
      build-dir: ${{ needs.workspace-setup.outputs.build-dir }}
      artifact: staging-build
      release: staging-${{ github.sha }}

  deploy-staging:
    name: Deploy staging
    if: github.ref == 'refs/heads/staging'
    needs:
      - workspace-setup
      - build-staging
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      cache-key: ${{ needs.workspace-setup.outputs.cache-key}}
      node-version: ${{ needs.workspace-setup.outputs.node-version }}
      gcloud-project: gorgias-helpdesk-staging
      bucket: gs://gorgias-assets-staging
      clusters: gorgias-helpdesk-staging-us-east1-86cc
      bucket-path: ${{ needs.workspace-setup.outputs.bucket-path }}
      assets-dir: ${{ needs.workspace-setup.outputs.assets-dir }}
      build-dir: ${{ needs.workspace-setup.outputs.build-dir }}
      artifact: staging-build
      sentry-project: helpdesk-staging
      release: staging-${{ github.sha }}

  build-production:
    name: Build production
    if: github.ref == 'refs/heads/main'
    needs:
      - workspace-setup
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      cache-key: ${{ needs.workspace-setup.outputs.cache-key }}
      node-version: ${{ needs.workspace-setup.outputs.node-version }}
      assets-url: https://gorgias-assets.gorgias.io/${{ needs.workspace-setup.outputs.bucket-path }}
      build-dir: ${{ needs.workspace-setup.outputs.build-dir }}
      artifact: production-build
      release: production-${{ github.sha }}

  deploy-production:
    name: Deploy production
    if: github.ref == 'refs/heads/main'
    needs:
      - workspace-setup
      - quality-check
      - build-production
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      cache-key: ${{ needs.workspace-setup.outputs.cache-key}}
      node-version: ${{ needs.workspace-setup.outputs.node-version }}
      bucket: gs://gorgias-assets-production
      gcloud-project: gorgias-helpdesk-production
      clusters: >-
        gorgias-helpdesk-production-aus-southeast1-fcb9
        gorgias-helpdesk-production-europe-west1-c511
        gorgias-helpdesk-production-europe-west3-86c1
        gorgias-helpdesk-production-us-central1-c433
        gorgias-helpdesk-production-us-central1-d8ff
        gorgias-helpdesk-production-us-east1-2607
        gorgias-helpdesk-production-us-east1-c94b
        gorgias-helpdesk-production-us-east4-5f09
        gorgias-helpdesk-production-us-east4-65cd
        gorgias-helpdesk-production-europe-west4-e7f4
        gorgias-main-us-east1-635c
      bucket-path: ${{ needs.workspace-setup.outputs.bucket-path }}
      assets-dir: ${{ needs.workspace-setup.outputs.assets-dir }}
      build-dir: ${{ needs.workspace-setup.outputs.build-dir }}
      artifact: production-build
      sentry-project: helpdesk-web-app
      release: production-${{ github.sha }}

  Chromatic:
    name: Upload Chromatic
    needs:
      - workspace-setup
    runs-on: gh-actions-4cpu8gb-runner-set

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ needs.workspace-setup.outputs.node-version }}
          cache-key: ${{ needs.workspace-setup.outputs.cache-key }}
          npm-token: ${{ secrets.GH_READ_PACKAGES_TOKEN }}

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/helpdesk
          storybookBaseDir: apps/helpdesk
          storybookConfigDir: .storybook
          buildScriptName: "storybook:build"
          exitOnceUploaded: true
          autoAcceptChanges: "main"
          debug: true
          onlyChanged: true
          uploadMetadata: true
          zip: true
