name: Preview Deploy
# Builds and uploads preview assets for every PR

on:
  workflow_run:
    workflows: [CICD]
    types: [completed]
    branches-ignore:
      - main
      - staging
  pull_request:
    types: [closed]

concurrency:
  group: preview-${{ github.event.pull_request.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write

env:
  GH_TOKEN: ${{ github.token }}
  NODE_VERSION: "24.15.0"
  BUILD_DIR: apps/helpdesk/build

jobs:
  pr-context:
    name: PR context
    if: github.event_name == 'workflow_run'
    runs-on: gh-actions-0.5cpu1gb-runner-set
    outputs:
      should-run: ${{ steps.pr.outputs.should-run }}
      head-ref: ${{ steps.pr.outputs.head-ref }}
      head-sha: ${{ steps.pr.outputs.head-sha }}
      pr-author: ${{ steps.pr.outputs.pr-author }}
      pr-number: ${{ steps.pr.outputs.pr-number }}
    steps:
      - name: Resolve PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;

            if (run.conclusion === 'cancelled' || run.conclusion === 'skipped') {
              core.setOutput('should-run', 'false');
              return;
            }

            let pullRequest = run.pull_requests?.[0];

            if (!pullRequest) {
              const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                ...context.repo,
                commit_sha: run.head_sha,
              });
              pullRequest = pullRequests.find((pr) => pr.state === 'open');
            }

            if (!pullRequest) {
              core.setOutput('should-run', 'false');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullRequest.number,
            });

            if (pr.state !== 'open') {
              core.setOutput('should-run', 'false');
              return;
            }

            core.setOutput('should-run', 'true');
            core.setOutput('head-ref', pr.head.ref);
            core.setOutput('head-sha', pr.head.sha);
            core.setOutput('pr-author', pr.user.login);
            core.setOutput('pr-number', pr.number);

  workspace-setup:
    name: Workspace setup
    needs: pr-context
    if: needs.pr-context.outputs.should-run == 'true'
    runs-on: gh-actions-4cpu12gb-runner-set
    outputs:
      cache-key: ${{ env.CACHE_KEY }}
      preview-path: ${{ steps.sanitize.outputs.preview-path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.pr-context.outputs.head-sha }}

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-token: ${{ secrets.GH_READ_PACKAGES_TOKEN }}

      - name: Sanitize branch name
        id: sanitize
        env:
          OWNER: ${{ needs.pr-context.outputs.pr-author }}
          BRANCH: ${{ needs.pr-context.outputs.head-ref }}
        shell: bash
        run: |
          SANITIZED=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9-]/-/g' | sed 's/--*/-/g' | tr '[:upper:]' '[:lower:]' | cut -c1-63)
          echo "preview-path=preview/${OWNER}/${SANITIZED}" >> "$GITHUB_OUTPUT"

  build-preview:
    name: Build preview
    needs:
      - pr-context
      - workspace-setup
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      cache-key: ${{ needs.workspace-setup.outputs.cache-key }}
      node-version: "24.15.0"
      assets-url: https://gorgias-assets.gorgias.io/web-app
      release: preview-${{ needs.pr-context.outputs.pr-number }}-${{ needs.pr-context.outputs.head-sha }}
      build-dir: apps/helpdesk/build
      artifact: preview-build
      no-content-hash: true
      force-deploy-commit: ${{ needs.pr-context.outputs.head-sha }}

  upload-preview:
    name: Upload preview
    needs:
      - workspace-setup
      - build-preview
    runs-on: gh-actions-2cpu2gb-dind-runner-set
    container:
      image: us-central1-docker.pkg.dev/gorgias-ops-production/container-images/toolbox:latest
      credentials:
        username: _json_key
        password: ${{ secrets.GCLOUD_SERVICE_KEY_FILE }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: build
          name: preview-build

      - name: Prepare service account
        shell: bash
        run: |
          cat <<EOF > key.json
            ${{ secrets.GCLOUD_SERVICE_KEY_FILE }}
          EOF
          gcloud auth activate-service-account ${{ secrets.GCLOUD_SERVICE_ACCOUNT }} --key-file=key.json --project=gorgias-helpdesk-development

      - name: Compress and upload to GCS
        shell: bash
        env:
          PREVIEW_PATH: ${{ needs.workspace-setup.outputs.preview-path }}
        run: |
          mkdir -p compressed
          for f in build/helpdesk.app.js \
                   build/helpdesk.app.css \
                   build/helpdesk.shared-worker.js \
                   build/helpdesk.service-worker.js \
                   build/manifest.json; do
            if [ -f "$f" ]; then
              gzip -9 -c "$f" > "compressed/$(basename "$f")"
            fi
          done

          gsutil \
            -h "Content-Encoding:gzip" \
            -h "Cache-Control:no-cache" \
            -m -q rsync -R \
            compressed/ \
            "gs://gorgias-assets-development/${PREVIEW_PATH}/web-app/build/"

  comment-on-pr:
    name: Comment on PR
    needs:
      - pr-context
      - workspace-setup
      - upload-preview
    runs-on: gh-actions-0.5cpu1gb-runner-set
    steps:
      - name: Generate Requestly rule JSON
        uses: actions/github-script@v8
        env:
          PREVIEW_PATH: ${{ needs.workspace-setup.outputs.preview-path }}
        with:
          script: |
            const fs = require('fs');
            const previewPath = process.env.PREVIEW_PATH;
            const baseUrl = `https://gorgias-assets.gorgi.us/${previewPath}/web-app/build`;
            const redirectUrl = `${baseUrl}/helpdesk.$1.$2`;
            const now = Date.now();

            const requestlyRule = [
              {
                createdBy: 'browserstack-9171336',
                creationDate: now,
                currentOwner: 'browserstack-9171336',
                description: '',
                extensionRules: [
                  {
                    action: {
                      redirect: {
                        url: redirectUrl,
                      },
                      type: 'redirect',
                    },
                    condition: {
                      excludedInitiatorDomains: ['requestly.io'],
                      excludedRequestDomains: ['requestly.io'],
                      isUrlFilterCaseSensitive: true,
                      regexFilter: '.*?helpdesk\\.(app|shared-worker|service-worker)\\.[a-zA-Z0-9]+\\.(js|css)$.*',
                    },
                  },
                ],
                groupId: '',
                id: 'Redirect_helpdeskPreviewAssets',
                isSample: false,
                lastModifiedBy: 'browserstack-9171336',
                modificationDate: now,
                name: 'HelpDesk Asset Rule',
                objectType: 'rule',
                pairs: [
                  {
                    destination: redirectUrl,
                    destinationType: 'url',
                    id: 'preview-rule-pair',
                    source: {
                      key: 'Url',
                      operator: 'Matches',
                      value: '/helpdesk\\.(app|shared-worker|service-worker)\\.[a-zA-Z0-9]+\\.(js|css)$/',
                    },
                  },
                ],
                preserveCookie: false,
                ruleType: 'Redirect',
                schemaVersion: '3.0.0',
                status: 'Inactive',
              },
            ];

            fs.writeFileSync(
              'requestly-helpdesk-preview-rule.json',
              JSON.stringify(requestlyRule, null, 2),
            );

      - name: Upload Requestly rule artifact
        uses: actions/upload-artifact@v7
        with:
          name: preview-requestly-rule
          path: requestly-helpdesk-preview-rule.json

      - name: Create or update PR comment
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ needs.pr-context.outputs.head-sha }}
          PREVIEW_PATH: ${{ needs.workspace-setup.outputs.preview-path }}
          PR_NUMBER: ${{ needs.pr-context.outputs.pr-number }}
        with:
          script: |
            const marker = '<!-- pr-preview-deploy -->';
            const previewPath = process.env.PREVIEW_PATH;
            const baseUrl = `https://gorgias-assets.gorgi.us/${previewPath}/web-app/build`;
            const jsUrl = `${baseUrl}/helpdesk.app.js`;
            const cssUrl = `${baseUrl}/helpdesk.app.css`;
            const sharedWorkerUrl = `${baseUrl}/helpdesk.shared-worker.js`;
            const serviceWorkerUrl = `${baseUrl}/helpdesk.service-worker.js`;
            const manifestUrl = `${baseUrl}/manifest.json`;
            const regex = '/helpdesk\\.(app|shared-worker|service-worker)\\.[a-zA-Z0-9]+\\.(js|css)$/';
            const destinationTemplate = `${baseUrl}/helpdesk.$1.$2`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: artifactsData } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const requestlyArtifact = artifactsData.artifacts.find(
              (artifact) => artifact.name === 'preview-requestly-rule',
            );
            const artifactUrl = requestlyArtifact
              ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${requestlyArtifact.id}`
              : runUrl;

            const body = [
              marker,
              '## Preview Deployment',
              '',
              `- JS: \`${jsUrl}\``,
              `- CSS: \`${cssUrl}\``,
              `- Shared Worker: \`${sharedWorkerUrl}\``,
              `- Service Worker: \`${serviceWorkerUrl}\``,
              `- Manifest: \`${manifestUrl}\``,
              `- Requestly JSON: [preview-requestly-rule](${artifactUrl})`,
              '- Quick start: [Helpdesk PR Preview - Simple & Quick Guide](https://www.notion.so/gorgias/Helpdesk-PR-Preview-Simple-Quick-Guide-30a1ae2178f580acbf91e05b1310189f) (refer here for an easy start)',
              '',
              `Rule: \`${regex}\` → \`${destinationTemplate}\``,
              '',
              'QA:',
              '1. Import `requestly-helpdesk-preview-rule.json` from the artifact and enable it.',
              '2. Hard refresh Helpdesk (`Cmd/Ctrl + Shift + R`).',
              '3. Verify `helpdesk.app` JS/CSS and `helpdesk.shared-worker` / `helpdesk.service-worker` requests redirect to preview URLs.',
              '',
              `_Last updated: ${new Date().toISOString()} (commit: ${process.env.HEAD_SHA.substring(0, 7)})_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.PR_NUMBER),
                body,
              });
            }

  cleanup-preview:
    name: Cleanup preview
    if: github.event.action == 'closed'
    runs-on: gh-actions-2cpu2gb-dind-runner-set
    container:
      image: us-central1-docker.pkg.dev/gorgias-ops-production/container-images/toolbox:latest
      credentials:
        username: _json_key
        password: ${{ secrets.GCLOUD_SERVICE_KEY_FILE }}
    steps:
      - name: Sanitize branch name
        id: sanitize
        env:
          OWNER: ${{ github.event.pull_request.user.login }}
          BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          SANITIZED=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9-]/-/g' | sed 's/--*/-/g' | tr '[:upper:]' '[:lower:]' | cut -c1-63)
          echo "preview-path=preview/${OWNER}/${SANITIZED}" >> "$GITHUB_OUTPUT"

      - name: Prepare service account
        shell: bash
        run: |
          cat <<EOF > key.json
            ${{ secrets.GCLOUD_SERVICE_KEY_FILE }}
          EOF
          gcloud auth activate-service-account ${{ secrets.GCLOUD_SERVICE_ACCOUNT }} --key-file=key.json --project=gorgias-helpdesk-development

      - name: Remove preview assets from GCS
        shell: bash
        env:
          PREVIEW_PATH: ${{ steps.sanitize.outputs.preview-path }}
        run: |
          gsutil -m -q rm -r "gs://gorgias-assets-development/${PREVIEW_PATH}/" || true
