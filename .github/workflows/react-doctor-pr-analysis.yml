name: React Doctor PR Analysis

on:
  workflow_run:
    workflows: [CICD]
    types: [completed]
    branches-ignore:
      - main
      - staging

permissions:
  actions: read
  contents: read
  pull-requests: write

env:
  GH_TOKEN: ${{ github.token }}
  NODE_VERSION: "24.15.0"
  REACT_DOCTOR_GCLOUD_PROJECT: gorgias-helpdesk-staging
  REACT_DOCTOR_GCS_BUCKET: gs://gorgias-assets-staging/react-doctor-reports/helpdesk-web-app

concurrency:
  group: react-doctor-pr-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  pr-context:
    name: PR context
    runs-on: gh-actions-0.5cpu1gb-runner-set
    outputs:
      base-ref: ${{ steps.pr.outputs.base-ref }}
      head-repo-fork: ${{ steps.pr.outputs.head-repo-fork }}
      head-sha: ${{ steps.pr.outputs.head-sha }}
      pr-number: ${{ steps.pr.outputs.pr-number }}
      should-run: ${{ steps.pr.outputs.should-run }}
    steps:
      - name: Resolve PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;

            if (run.conclusion === 'cancelled' || run.conclusion === 'skipped') {
              core.setOutput('should-run', 'false');
              return;
            }

            let pullRequest = run.pull_requests?.[0];

            if (!pullRequest) {
              const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                ...context.repo,
                commit_sha: run.head_sha,
              });
              pullRequest = pullRequests.find((pr) => pr.state === 'open');
            }

            if (!pullRequest) {
              core.setOutput('should-run', 'false');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullRequest.number,
            });

            if (pr.state !== 'open') {
              core.setOutput('should-run', 'false');
              return;
            }

            core.setOutput('base-ref', pr.base.ref);
            core.setOutput('head-repo-fork', String(pr.head.repo.fork));
            core.setOutput('head-sha', pr.head.sha);
            core.setOutput('pr-number', pr.number);
            core.setOutput('should-run', 'true');

  workspace-setup:
    name: Workspace setup
    needs: pr-context
    if: needs.pr-context.outputs.should-run == 'true' && needs.pr-context.outputs.head-repo-fork == 'false'
    runs-on: gh-actions-4cpu12gb-runner-set
    outputs:
      cache-key: ${{ env.CACHE_KEY }}
      has-react-doctor-affected-packages: ${{ env.HAS_REACT_DOCTOR_AFFECTED_PACKAGES }}
      react-doctor-affected-packages: ${{ env.REACT_DOCTOR_AFFECTED_PACKAGES }}
      nx-base-ref: ${{ env.NX_BASE_REF }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.pr-context.outputs.head-sha }}

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-token: ${{ secrets.GH_READ_PACKAGES_TOKEN }}

      - name: Get affected packages
        run: |
          NX_BASE_REF="origin/${{ needs.pr-context.outputs.base-ref }}"
          git fetch origin "${{ needs.pr-context.outputs.base-ref }}" --depth=1
          echo "NX_BASE_REF=$NX_BASE_REF" >> "$GITHUB_ENV"

          REACT_DOCTOR_AFFECTED_PACKAGES_JSON=$(npx nx show projects --affected --with-target=lint --exclude=@repo/root --json --base="$NX_BASE_REF" --head=HEAD)

          if echo "$REACT_DOCTOR_AFFECTED_PACKAGES_JSON" | jq -e '. | length > 0' > /dev/null; then
            REACT_DOCTOR_AFFECTED_PACKAGES_MATRIX=$(echo "$REACT_DOCTOR_AFFECTED_PACKAGES_JSON" | jq -c 'map({project: ., alias: (sub("^@"; "") | gsub("/"; "-"))})')
            echo "REACT_DOCTOR_AFFECTED_PACKAGES=$REACT_DOCTOR_AFFECTED_PACKAGES_MATRIX" >> "$GITHUB_ENV"
            echo "HAS_REACT_DOCTOR_AFFECTED_PACKAGES=true" >> "$GITHUB_ENV"
            echo "Found affected packages for React Doctor: $REACT_DOCTOR_AFFECTED_PACKAGES_JSON"
          else
            echo "REACT_DOCTOR_AFFECTED_PACKAGES=[]" >> "$GITHUB_ENV"
            echo "HAS_REACT_DOCTOR_AFFECTED_PACKAGES=false" >> "$GITHUB_ENV"
            echo "No affected packages with lint target found for React Doctor"
          fi

  react-doctor-scan:
    name: React Doctor scan
    needs:
      - pr-context
      - workspace-setup
    if: needs.workspace-setup.outputs.has-react-doctor-affected-packages == 'true'
    runs-on: gh-actions-4cpu12gb-runner-set
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.workspace-setup.outputs.react-doctor-affected-packages) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.pr-context.outputs.head-sha }}

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-key: ${{ needs.workspace-setup.outputs.cache-key }}
          npm-token: ${{ secrets.GH_READ_PACKAGES_TOKEN }}

      - name: Ensure diagnostics directory exists
        run: mkdir -p .diagnostics/react-doctor-reports

      - name: Run React Doctor diagnostics
        run: pnpm react-doctor --project=${{ matrix.project }} --output-dir=.diagnostics/react-doctor-reports --fail-on=none

      - name: Upload React Doctor report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: react-doctor-${{ matrix.alias }}
          path: |
            .diagnostics/react-doctor-reports/react-doctor-report-${{ matrix.alias }}.log
            .diagnostics/react-doctor-reports/react-doctor-report-${{ matrix.alias }}.json

  react-doctor-compare:
    name: React Doctor compare
    needs:
      - pr-context
      - workspace-setup
      - react-doctor-scan
    if: ${{ needs.workspace-setup.outputs.has-react-doctor-affected-packages == 'true' && !cancelled() }}
    runs-on: gh-actions-1cpu2gb-dind-runner-set
    container: google/cloud-sdk:502.0.0-alpine
    env:
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcloud-key.json
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.pr-context.outputs.head-sha }}

      - name: Download React Doctor report artifact
        uses: actions/download-artifact@v8
        with:
          pattern: react-doctor-*
          path: pr-reports
          merge-multiple: true

      - name: Authenticate with GCS
        shell: sh
        run: |
          cat <<EOF > "$GOOGLE_APPLICATION_CREDENTIALS"
          ${{ secrets.GCLOUD_SERVICE_KEY_FILE }}
          EOF
          gcloud auth activate-service-account ${{ secrets.GCLOUD_SERVICE_ACCOUNT }} \
            --key-file="$GOOGLE_APPLICATION_CREDENTIALS" \
            --project="$REACT_DOCTOR_GCLOUD_PROJECT"

      - name: Download latest baseline report from GCS
        shell: sh
        run: |
          mkdir -p baseline-reports
          gsutil cp \
            "$REACT_DOCTOR_GCS_BUCKET/latest/react-doctor-report-*.json" \
            baseline-reports/ || true

      - name: Install Node.js
        shell: sh
        run: apk add --no-cache nodejs npm

      - name: Compare reports
        shell: sh
        run: |
          node scripts/react-doctor/compare-reports.mjs \
            --pr-reports-dir="pr-reports" \
            --baseline-reports-dir="baseline-reports" \
            --max-examples-per-rule=3 \
            --max-rule-groups=10 \
            --output="react-doctor-report.md"

      - name: Upload React Doctor markdown artifact
        uses: actions/upload-artifact@v7
        with:
          name: react-doctor-md
          path: react-doctor-report.md

  react-doctor-comment:
    name: React Doctor comment
    needs:
      - pr-context
      - workspace-setup
      - react-doctor-compare
    if: ${{ needs.workspace-setup.outputs.has-react-doctor-affected-packages == 'true' && !cancelled() }}
    runs-on: gh-actions-0.5cpu1gb-runner-set
    steps:
      - name: Download React Doctor markdown artifacts
        uses: actions/download-artifact@v8
        with:
          name: react-doctor-md
          path: md-reports

      - name: Create or update PR comment
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ needs.pr-context.outputs.pr-number }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const marker = '<!-- react-doctor -->';
            const reportPath = path.join('md-reports', 'react-doctor-report.md');
            const maxBodyLength = 65000;
            const reportBody = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8').trim()
              : '_No React Doctor report generated._';
            let body = `${marker}\n${reportBody}`;

            if (body.length > maxBodyLength) {
              body =
                `${marker}\n## React Doctor\n\n` +
                "_React Doctor found too much output to fit in one PR comment. Check the workflow artifacts for the full report._";
            }

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: Number(process.env.PR_NUMBER),
            });

            const previousComment = comments.find(
              (comment) => comment.body?.startsWith(marker),
            );

            if (previousComment) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previousComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: Number(process.env.PR_NUMBER),
                body,
              });
            }
